apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: monitoring

  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: devops-monitoring-platform

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: localhost/devops-monitoring-backend:v3

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: monitoring-config
                  key: APP_NAME

            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: monitoring-config
                  key: APP_VERSION

            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: monitoring-config
                  key: DEBUG

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: DATABASE_URL

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: SECRET_KEY

            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: monitoring-config
                  key: CORS_ORIGINS

            - name: AGENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: AGENT_USERNAME

            - name: AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: AGENT_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"