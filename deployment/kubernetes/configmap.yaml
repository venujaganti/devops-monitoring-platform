apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: monitoring
data:
  APP_NAME: "DevOps Monitoring Platform"
  APP_VERSION: "1.0.0"
  DEBUG: "false"

  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  POSTGRES_DB: "monitoring_db"
  POSTGRES_USER: "monitor_user"

  CORS_ORIGINS: ""

  BACKEND_URL: "http://backend:8000"

  AGENT_INTERVAL: "30"
  REQUEST_TIMEOUT: "10"